# proguard configuration for quantum fabric client
# stage 2: obfuscation after dead code injection

# ---------- input/output ----------
-injars build/libs/quantum-unobfuscated.jar
-outjars build/libs/quantum-${mod_version}.jar

# Library jars - Minecraft + Java runtime (don't modify, just use for class hierarchy)
-libraryjars <java.home>/jmods/java.base.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.desktop.jmod(!**.jar;!module-info.class)
-libraryjars <java.home>/jmods/java.logging.jmod(!**.jar;!module-info.class)
# Minecraft merged jar with mappings (set dynamically in build.gradle)

# ---------- preserve fabric infrastructure ----------

# fabric loader entrypoints
-keep class base.CattoWare {
    public <methods>;
}
-keep class base.CattoWareDataGenerator {
    public <methods>;
}
-keep class base.client.CattoWareClient {
    public <methods>;
}

# fabric mod initializers
-keep class * implements net.fabricmc.api.ModInitializer {
    public <methods>;
}
-keep class * implements net.fabricmc.api.ClientModInitializer {
    public <methods>;
}

# ---------- mixin infrastructure (critical!) ----------

# keep ALL mixin classes with their exact names - obfuscation breaks descriptors
-keep @org.spongepowered.asm.mixin.Mixin class * {
    *;
}

# keep mixin class names to prevent descriptor parsing errors
-keepnames @org.spongepowered.asm.mixin.Mixin class *

# keep all mixin package class names (accessors, invokers, etc.)
-keepnames class base.mixin.** { *; }

# preserve all mixin annotations
-keepattributes *Annotation*

# keep mixin annotation members
-keepclassmembers class * {
    @org.spongepowered.asm.mixin.Shadow *;
    @org.spongepowered.asm.mixin.injection.Inject *;
    @org.spongepowered.asm.mixin.injection.Redirect *;
    @org.spongepowered.asm.mixin.injection.ModifyArg *;
    @org.spongepowered.asm.mixin.injection.ModifyArgs *;
    @org.spongepowered.asm.mixin.injection.ModifyVariable *;
    @org.spongepowered.asm.mixin.injection.ModifyConstant *;
    @org.spongepowered.asm.mixin.Unique *;
    @org.spongepowered.asm.mixin.Overwrite *;
}

# mixin accessors
-keep interface *Accessor {
    <methods>;
}
-keep interface *Invoker {
    <methods>;
}

# ---------- preserve event system ----------

# lambdaevents framework - keep methods but allow name obfuscation
-keepclassmembers,allowobfuscation class * {
    @net.lenni0451.lambdaevents.EventHandler <methods>;
}

# ---------- preserve dead code fields ----------

# keep all injected index fields (critical - prevents proguard from removing them)
-keepclassmembers class * {
    private int index*;
    private long index*;
}

# keep string decryptor class (base.a with methods a/b/c/d/e)
# DO NOT obfuscate - encrypted bytecode calls base/a.a directly!
-keep class base.a {
    *;
}

# ---------- preserve reflection-accessed elements ----------

# keep ui classes and their methods (prevent AbstractMethodError in rendering)
# DO NOT use allowobfuscation here - we need ALL methods preserved
-keep class base.client.ui.** {
    *;
}

# keep clickgui classes - STRICT preservation
-keep class base.client.clickgui.** {
    *;
}

# keep all classes that extend minecraft GUI classes
-keep class * extends net.minecraft.class_437 {
    *;
}

# With library jars, ProGuard knows the class hierarchy
# Only keep methods that actually override Minecraft/Fabric methods

# module system (allow name/package obfuscation)
-keep,allowobfuscation class * extends base.client.feature.Feature {
    public <init>(...);
    public <methods>;
}

# command system (allow name/package obfuscation)
-keep,allowobfuscation class * extends base.client.cmd.Command {
    public <init>(...);
    public <methods>;
}

# settings/config classes (allow name/package obfuscation)
-keep,allowobfuscation class * extends base.client.feature.settings.Setting {
    public <init>(...);
    public <methods>;
}

# anti-debug protection (obfuscated builds only)
-keep class com.quantum.obfuscator.AntiDebug {
    public static void initializeProtection();
    *;
}

# ---------- preserve rendering and UI classes ----------
# NOTE: Using -keepclassmembers instead of -keep to allow class name obfuscation

# allow class name obfuscation but keep members for visual/render classes
-keepclassmembers class base.client.feature.impl.visual.** {
    *;
}

# allow class name obfuscation but keep members for HUD
-keepclassmembers class base.client.feature.impl.hud.** {
    *;
}

# screen/gui: keep class names to prevent instantiation issues, but obfuscate members
-keep,allowobfuscation class base.client.gui.** {
}
-keepclassmembers class base.client.gui.** {
    public <init>(...);
    public void method_*(...);  # Minecraft screen methods
}

# rendering utilities: allow full obfuscation except public API
-keepclassmembers class base.client.helpers.render.** {
    public static *;
}

# font renderer: allow full obfuscation except public API
-keepclassmembers class base.client.helpers.font.** {
    public static *;
}

# ---------- proguard optimization settings ----------

# disable optimization to preserve dead code and prevent removal
-dontoptimize

# disable shrinking to keep all classes and methods (including 5000 dummy classes!)
-dontshrink

# keep ALL dummy classes (they start with 'z')
-keep class z** {
    *;
}

# aggressive name mangling
-repackageclasses ''
-allowaccessmodification

# ---------- proguard name obfuscation settings ----------

# FLATTEN PACKAGES - move all classes to root EXCEPT Mixins
-repackageclasses ''

# obfuscate with minimal dictionary for short names
-obfuscationdictionary proguard-dictionary.txt
-classobfuscationdictionary proguard-dictionary.txt  
-packageobfuscationdictionary proguard-dictionary.txt

# allow access modification for better obfuscation
-allowaccessmodification

# preserve ONLY mixin package structure (critical for Mixin descriptor parsing!)
-keeppackagenames org.spongepowered.asm.**
-keeppackagenames base.mixin.**

# keep fabric/minecraft packages that might be referenced
-keeppackagenames net.fabricmc.**
-keeppackagenames net.minecraft.**

# keep fabric packages to avoid bootstrap issues  
-keeppackagenames net.fabricmc.**

# keep minecraft obfuscated names
-keeppackagenames net.minecraft.**

# ---------- preserve metadata ----------

# keep source file attribute for better stack traces (optional - comment out for more obfuscation)
# -keepattributes SourceFile,LineNumberTable

# keep inner class info
-keepattributes InnerClasses,EnclosingMethod

# keep runtime annotations
-keepattributes RuntimeVisibleAnnotations,RuntimeInvisibleAnnotations

# keep signatures for generics
-keepattributes Signature

# ---------- misc ----------

# don't warn about missing classes from minecraft/fabric
-dontwarn **
-ignorewarnings

# verbose output
-verbose

// ---------- obfuscation pipeline ----------

// stage 0: generate junk code source files (before compilation)
tasks.register('generateJunkCode', JavaExec) {
	group = 'obfuscation'
	description = 'generates fake java source files with dead code and impossible control flow'

	// include buildSrc output and its dependencies
	classpath = buildscript.configurations.classpath + files("$rootDir/buildSrc/build/classes/java/main")
	mainClass = 'com.quantum.obfuscator.JunkCodeGenerator'

	// generate to build directory, not source tree
	def junkCodeDir = layout.buildDirectory.dir("generated/sources/junk")

	args = [
			junkCodeDir.get().asFile.absolutePath,  // output to build dir
			'15',    // number of junk classes
			'25',    // methods per class
			'80'     // variables per method
	]

	outputs.dir(junkCodeDir)

	doFirst {
		def dir = junkCodeDir.get().asFile
		// clean old junk code
		if (dir.exists()) {
			dir.deleteDir()
		}
		dir.mkdirs()
		println "generating junk code to ${dir}..."
	}

	doLast {
		println "junk code generation complete"
	}
}


// stage 1.6: string encryption (POST-remapJar - work on JAR file!)
tasks.register('encryptStringsInJar', JavaExec) {
	group ='obfuscation'
	description = 'encrypts strings in the remapped JAR (before ProGuard)'

	dependsOn remapJar

	def jarPath = layout.buildDirectory.file("libs/quantum-${project.version}-unobfuscated.jar").get().asFile.absolutePath
	def extractDir = layout.buildDirectory.dir("jar-encryption-temp").get().asFile.absolutePath

	doFirst {
		println "extracting remapped JAR for string encryption..."
		ant.unzip(src: jarPath, dest: extractDir, overwrite: true)
	}

	classpath = buildscript.configurations.classpath + files("$rootDir/buildSrc/build/classes/java/main")
	mainClass = 'com.quantum.obfuscator.StringEncryptor'

	args = [
			extractDir,
			'true'
	]

	doLast {
		println "repackaging JAR with encrypted strings..."
		ant.zip(destfile: jarPath, basedir: extractDir, update: false)
		ant.delete(dir: extractDir)
		println "string encryption complete (JAR-based, pre-ProGuard)"
	}
}

// stage 1.7: control flow flattening (was dummy class injection - moved to post-proguard)
tasks.register('flattenControlFlow', JavaExec) {
	group = 'obfuscation'
	description = 'flattens control flow into state machines (makes decompiled code unreadable)'

	dependsOn injectDeadCode  // number obfuscation moved to JAR-based stage

	classpath = buildscript.configurations.classpath + files("$rootDir/buildSrc/build/classes/java/main")
	mainClass = 'com.quantum.obfuscator.ControlFlowFlattener'

	args = [
			file('build/classes/java/main').absolutePath,
			'true'  // verbose
	]

	doLast {
		println "control flow flattening complete"
	}
}


			tempJar,
			'false'  // verbose
	]

	doLast {
		// replace original with processed
		ant.move(file: tempJar, tofile: obfJar, overwrite: true)
		println "tamper detection injection complete"
	}
}

// stage 3.6: inject anti-debug into obfuscated JAR
tasks.register('postProguardAntiDebug', JavaExec) {
	group = 'obfuscation'
	description = 'injects anti-debug AFTER proguard (obfuscated builds only)'

	dependsOn postProguardTamperDetection

	def obfJar = layout.buildDirectory.file("libs/quantum-${project.version}.jar").get().asFile.absolutePath
	def extractDir = layout.buildDirectory.dir("obfuscated-extracted").get().asFile.absolutePath
	def antiDebugClass = layout.projectDirectory.file("buildSrc/build/classes/java/main/com/quantum/obfuscator/AntiDebug.class").asFile.absolutePath

	doFirst {
		// extract obfuscated JAR
		println "extracting obfuscated JAR for anti-debug injection..."
		ant.unzip(src: obfJar, dest: extractDir, overwrite: true)

		// copy AntiDebug.class into extracted JAR
		ant.mkdir(dir: "${extractDir}/com/quantum/obfuscator")
		ant.copy(file: antiDebugClass, todir: "${extractDir}/com/quantum/obfuscator")
	}

	classpath = buildscript.configurations.classpath + files("$rootDir/buildSrc/build/classes/java/main")
	mainClass = 'com.quantum.obfuscator.AntiDebugInjector'

	args = [
			extractDir,
			'true'  // verbose
	]

	doLast {
		// repackage JAR
		println "repackaging JAR with anti-debug..."
		ant.zip(destfile: obfJar, basedir: extractDir, update: false)

		// cleanup
		ant.delete(dir: extractDir)
		println "anti-debug injection complete (post-proguard)"
	}
}

// stage 3.7: inject 5000 dummy classes into obfuscated JAR
tasks.register('postProguardDummyClasses', JavaExec) {
	group = 'obfuscation'
	description = 'injects 5000 fake classes AFTER proguard (obfuscated builds only)'

	dependsOn postProguardAntiDebug

	def obfJar = layout.buildDirectory.file("libs/quantum-${project.version}.jar").get().asFile.absolutePath

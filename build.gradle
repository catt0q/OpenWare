// stage 3.4: number obfuscation (post-ProGuard for clean bytecode)
tasks.register('postProguardNumberObfuscation', JavaExec) {
	group = 'obfuscation'
	description = 'obfuscates integer constants with math operations AFTER proguard'

	dependsOn proguardObfuscate

	def obfJar = layout.buildDirectory.file("libs/quantum-${project.version}.jar").get().asFile.absolutePath
	def tempJar = layout.buildDirectory.file("libs/quantum-${project.version}-numbers.jar").get().asFile.absolutePath

	classpath = buildscript.configurations.classpath + files("$rootDir/buildSrc/build/classes/java/main")
	mainClass = 'com.quantum.obfuscator.NumberObfuscator'

	args = [
			obfJar,
			tempJar,
			'false'  // verbose
	]

	doLast {
		ant.move(file: tempJar, tofile: obfJar, overwrite: true)
		println "number obfuscation complete (post-proguard)"
	}
}

// stage 3.5: inject tamper detection into obfuscated JAR
tasks.register('postProguardTamperDetection', JavaExec) {
	group = 'obfuscation'
	description = 'injects tamper detection AFTER proguard'

	dependsOn postProguardNumberObfuscation

	def obfJar = layout.buildDirectory.file("libs/quantum-${project.version}.jar").get().asFile.absolutePath
	def tempJar = layout.buildDirectory.file("libs/quantum-${project.version}-temp.jar").get().asFile.absolutePath


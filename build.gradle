// make remapJar depend on obfuscation stages (NO anti-debug in unobf!)
tasks.named('remapJar') {
	dependsOn flattenControlFlow

	// rename output to unobfuscated
	archiveClassifier = 'unobfuscated'
}

// ---------- stage 2.5: opaque predicates (simple math only, no method calls) ----------
tasks.register('preProguardOpaquePredicates', JavaExec) {
	group = 'obfuscation'
	description = 'injects opaque predicates on clean bytecode BEFORE proguard'

	dependsOn encryptStringsInJar

	def inputJar = providers.provider { remapJar.archiveFile.get().asFile.absolutePath }
	def tempJar = providers.provider { remapJar.archiveFile.get().asFile.absolutePath.replace('.jar', '-predicates.jar') }

	classpath = buildscript.configurations.classpath + files("$rootDir/buildSrc/build/classes/java/main")
	mainClass = 'com.quantum.obfuscator.OpaquePredicateInjector'

	doFirst {
		args = [
				inputJar.get(),
				tempJar.get(),
				'false'  // verbose
		]
	}

	doLast {
		// replace original with processed
		ant.move(file: tempJar.get(), tofile: inputJar.get(), overwrite: true)
		println "opaque predicate injection complete (pre-proguard)"
	}
}

// ---------- stage 2.6: number obfuscation moved to post-ProGuard ----------
// pre-proguard causes stack frame issues when combined with control flow flattening
// running after proguard gives us clean bytecode to work with

// ---------- stage 3: proguard obfuscation ----------
tasks.register('proguardObfuscate', JavaExec) {
	group = 'obfuscation'
	description = 'runs proguard obfuscation on remapped jar'

	dependsOn preProguardOpaquePredicates

	classpath = configurations.proguard
	mainClass = 'proguard.ProGuard'

	// compute paths at configuration time to avoid config cache issues
	def inputJarPath = providers.provider { remapJar.archiveFile.get().asFile.absolutePath }
	def outputJarPath = providers.provider { layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}.jar").get().asFile.absolutePath }
	def tempConfigPath = providers.provider { layout.buildDirectory.file("proguard-runtime.conf").get().asFile.absolutePath }
	def baseConfigPath = layout.projectDirectory.file("proguard.conf").asFile.absolutePath
	def projectVersion = project.version as String
	def dictionaryPath = layout.projectDirectory.file("proguard-dictionary.txt").asFile.absolutePath
	def mcVersion = project.minecraft_version as String
	def userHome = System.getProperty('user.home')
	// Use intermediary-mapped Minecraft jar so ProGuard sees the same class names as runtime
	def minecraftJarPath = "${userHome}/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-intermediary/${mcVersion}-loom.mappings.1_21_11.layered+hash.2198-v2/minecraft-merged-intermediary-${mcVersion}-loom.mappings.1_21_11.layered+hash.2198-v2.jar"

	inputs.file(inputJarPath)
	inputs.file(baseConfigPath)
	outputs.file(outputJarPath)

	doFirst {
		def inputJar = inputJarPath.get()
		def outputJar = outputJarPath.get()

		println "running proguard obfuscation..."
		println "input: ${inputJar}"
		println "output: ${outputJar}"

		// ensure input jar exists
		def inputFile = new File(inputJar)
		if (!inputFile.exists()) {
			throw new GradleException("input jar not found: ${inputJar}")
		}

		// find Minecraft library jar for ProGuard
		def minecraftJar = new File(minecraftJarPath)

		// create modified config with actual paths
		def config = new File(baseConfigPath).text
		config = config.replace('build/libs/quantum-unobfuscated.jar', inputJar)
		config = config.replace('build/libs/quantum-${mod_version}.jar', outputJar)
		config = config.replace('${mod_version}', projectVersion)
		config = config.replace('proguard-dictionary.txt', dictionaryPath)

		// add Minecraft library jar if found
		if (minecraftJar.exists()) {
			println "adding Minecraft library: ${minecraftJar}"
			config = config + "\n-libraryjars ${minecraftJar.absolutePath}"
		}

		def tempConfig = new File(tempConfigPath.get())
		tempConfig.text = config

		// update args to use temp config
		args = ["@${tempConfig.absolutePath}"]
	}

	doLast {
		println "proguard obfuscation complete: ${outputJarPath.get()}"
		println "mapping file: build/proguard/mapping.txt (if verbose enabled)"
	}
}

// make build depend on proguard
tasks.named('build') {
	dependsOn proguardObfuscate
}


plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// proguard dependency
configurations {
	proguard
}

dependencies {
	proguard 'com.guardsquare:proguard-base:7.8.2'
	proguard 'com.guardsquare:proguard-core:7.8.2'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom{
	accessWidenerPath = file("src/main/resources/quantum.accesswidener")

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'


}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def jarArchivesName = project.base.archivesName.get()
	inputs.property "archivesName", jarArchivesName

	from("LICENSE") {
		rename { "${it}_${jarArchivesName}"}
	}
}

// ---------- auth flag for conditional compilation ----------
// auth is DISABLED by default (for dev/unobfuscated builds)
// for release/obfuscated builds, use: ./gradlew build -Pauth=true
def authEnabled = project.hasProperty('auth') ? project.property('auth').toString().toBoolean() : false

// generate AuthConfig.java with compile-time flag
tasks.register('generateAuthConfig') {
	group = 'build'
	description = 'generates AuthConfig.java with auth enabled/disabled flag'

	def outputDir = layout.buildDirectory.dir('generated/sources/authconfig')
	def authValue = authEnabled  // capture at configuration time

	outputs.dir(outputDir)
	inputs.property('authEnabled', authValue)

	doLast {
		def packageDir = new File(outputDir.get().asFile, 'base/client/auth')
		packageDir.mkdirs()

		def configFile = new File(packageDir, 'AuthConfig.java')
		configFile.text = """package base.client.auth;

/**
 * auto-generated at compile time
 * DO NOT EDIT - regenerated on each build
 * 
 * auth disabled by default (dev builds)
 * use: ./gradlew build -Pauth=true for release
 */
public class AuthConfig {
    public static final boolean AUTH_ENABLED = ${authValue};
}
"""
		println "generated AuthConfig.java with AUTH_ENABLED=${authValue}"
	}
}

// ---------- @obf-only preprocessor ----------
// strips code between // @obf-only start and // @obf-only end when auth is disabled
// this allows tamper checks to be completely removed from dev builds

tasks.register('preprocessSources') {
	group = 'build'
	description = 'preprocesses sources to strip @obf-only blocks when auth is disabled'

	def srcDir = file('src/main/java')
	def outputDir = layout.buildDirectory.dir('preprocessed/java')
	def authValue = authEnabled

	inputs.dir(srcDir)
	inputs.property('authEnabled', authValue)
	outputs.dir(outputDir)

	doLast {
		def outDir = outputDir.get().asFile
		outDir.deleteDir()
		outDir.mkdirs()

		def regex = ~/(?s)\/\/\s*@obf-only\s+start.*?\/\/\s*@obf-only\s+end\s*\n?/
		def processedCount = 0
		def strippedCount = 0

		srcDir.eachFileRecurse { file ->
			if (file.isFile() && file.name.endsWith('.java')) {
				def relativePath = srcDir.toPath().relativize(file.toPath())
				def outFile = new File(outDir, relativePath.toString())
				outFile.parentFile.mkdirs()

				def content = file.text

				if (!authValue) {
					// strip @obf-only blocks in dev builds
					def newContent = content.replaceAll(regex, '')
					if (newContent != content) {
						strippedCount++
					}
					content = newContent
				}

				outFile.text = content
				processedCount++
			}
		}

		if (authValue) {
			println "preprocessor: ${processedCount} files copied (auth enabled, @obf-only blocks kept)"
		} else {
			println "preprocessor: ${processedCount} files processed, ${strippedCount} files had @obf-only blocks stripped"
		}
	}
}

sourceSets {
	main {
		java {
			srcDir 'src/main/java'
			srcDir layout.buildDirectory.dir('generated/sources/authconfig')
		}
	}
}



// ensure preprocessing happens before compile
def preprocessedDir = layout.buildDirectory.dir("preprocessed/java")
def authGeneratedDir = layout.buildDirectory.dir("generated/sources/authconfig")

tasks.named('compileJava', JavaCompile).configure {
	dependsOn preprocessSources, generateAuthConfig

	source = files(
			fileTree(preprocessedDir),
			fileTree(authGeneratedDir)
	)
}



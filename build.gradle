// ---------- stage 0: SOURCE-LEVEL string encryption (WHITELIST approach) ----------
// Only encrypts strings in feature/impl/** and cmd/impl/** (safe files)

tasks.register('preprocessSourceForEncryption', JavaExec) {
	group = 'obfuscation'
	description = 'encrypts strings in Java source files BEFORE compilation'

	def srcDir = file('src/main/java').absolutePath
	def modifiedSrcDir = layout.buildDirectory.dir('modified-src/main/java').get().asFile.absolutePath

	inputs.dir('src/main/java')
	outputs.dir(modifiedSrcDir)

	doFirst {
		println "Preprocessing source for string encryption..."
	}

	classpath = buildscript.configurations.classpath + files("$rootDir/buildSrc/build/classes/java/main")
	mainClass = 'com.quantum.obfuscator.SourceStringEncryptor'

	args = [
			srcDir,
			modifiedSrcDir,
			'true'  // verbose
	]

	doLast {
		println "Source preprocessing complete!"
	}
}


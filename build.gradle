// ---------- stage 1: bytecode obfuscation (after compilation) ----------

// stage 1: inject dead code into compiled classes (before remapping)
tasks.register('injectDeadCode', JavaExec) {
	group = 'obfuscation'
	description = 'injects useless index fields and mutations into compiled bytecode'

	dependsOn compileJava

	// include buildSrc output and its dependencies (ASM)
	classpath = buildscript.configurations.classpath + files("$rootDir/buildSrc/build/classes/java/main")
	mainClass = 'com.quantum.obfuscator.DeadCodeInjector'

	args = [
			file('build/classes/java/main').absolutePath,  // input directory
			'40',      // fields per class
			'7',       // mutation density (every N instructions)
			'true'     // verbose output
	]

	doFirst {
		println "injecting dead code into compiled classes..."
	}

	doLast {
		println "dead code injection complete"
	}
}
